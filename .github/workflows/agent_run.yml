name: Contractor Leads 24/7 Agent

on:
  schedule:
    - cron: '0 */4 * * *'  # Runs every 4 hours
  workflow_dispatch:       # Allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install psycopg2-binary asyncpg
        playwright install chromium

    - name: Run ConstructLeads Agent
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      run: |
        python main.py

    - name: Commit and push updated Dashboard & JSON
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add data/opportunities.json docs/index.html
        # Only commit if there are changes
        git diff --quiet && git diff --staged --quiet || (git commit -m "auto: 🤖 update contractor dashboard [skip ci]" && git push)
