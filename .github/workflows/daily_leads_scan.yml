name: Daily Contractor Leads & Tenders Automation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "daily-contractor-leads"
  cancel-in-progress: false

jobs:
  scan-and-publish:
    runs-on: ubuntu-latest
    name: "Autonomous Lead & Tender Scan"
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Lead Ingestion & Pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_FACEBOOK_TASK_ID: ${{ secrets.APIFY_FACEBOOK_TASK_ID }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Commit and push updated opportunities and interactive docs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add data/ docs/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update live leads, tenders and interactive dashboard [skip ci]"
            git pull --rebase origin main
            git push origin main
          else
            echo "No new changes to commit or push."
          fi
